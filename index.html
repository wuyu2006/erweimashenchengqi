<body><main class="app"><header class="topbar"><div class="brand"><div class="logo">⌘</div><div><h1>CodeKit</h1><p>轻量、快速、好用的编码工具</p></div></div><button class="icon-btn" id="themeBtn" title="切换主题">☾</button></header>
<section class="hero"><h2>二维码与条码，一站式完成</h2><p>生成、下载、复制、解码，所有内容都在浏览器本地处理。</p></section>
<div class="layout"><section class="panel"><div class="mode"><button class="active" data-mode="qr">二维码</button><button data-mode="bar">条码</button></div>
<div id="qrArea"><nav class="tabs"><button class="active" data-tab="qrText">文本 / 链接</button><button data-tab="qrRandom">随机二维码</button><button data-tab="qrDecode">图片解码</button></nav>
<div class="view active" id="qrText"><div class="field"><label>内容</label><textarea class="input" id="qrInput" rows="3" placeholder="输入网址、文本或联系方式…"></textarea></div><div class="row"><div class="field"><label>容错级别</label><select class="select" id="qrLevel"><option value="L">低 · 适合短文本</option><option value="M" selected>中 · 推荐</option><option value="Q">高 · 更耐损</option><option value="H">最高 · 适合印刷</option></select></div><div class="field"><label>尺寸</label><select class="select" id="qrSize"><option value="220">220 px</option><option value="280" selected>280 px</option><option value="360">360 px</option></select></div></div><div class="actions"><button class="btn primary" id="qrGen">生成二维码</button><button class="btn ghost" id="qrClear">清空</button></div><div class="canvas" id="qrOutput"><div class="empty">输入内容后生成二维码</div></div><div class="actions"><button class="btn ghost" id="qrDownload">下载 PNG</button><button class="btn ghost" id="qrCopy">复制内容</button></div></div>
<div class="view" id="qrRandom"><div class="field"><label>随机内容长度</label><div class="row"><input class="input" id="randomLen" type="number" min="4" max="120" value="24"><button class="btn primary" id="randomGen">随机生成</button></div></div><div class="canvas" id="randomOutput"><div class="empty">点击按钮生成随机二维码</div></div><div class="result" id="randomText">—</div></div>

<div id="barArea" style="display:none"><nav class="tabs"><button class="active" data-tab="barText">文本条码</button><button data-tab="barRandom">随机条码</button><button data-tab="barDecode">图片解码</button></nav>
<div class="view active" id="barText"><div class="field"><label>内容（Code 128 支持 ASCII 字符）</label><input class="input" id="barInput" placeholder="例如：CODEKIT-2026"></div><div class="actions"><button class="btn primary" id="barGen">生成条码</button><button class="btn ghost" id="barClear">清空</button></div><div class="canvas" id="barOutput"><div class="empty">输入内容后生成条码</div></div><button class="btn ghost" id="barDownload">下载 SVG</button></div>
<div class="view" id="barRandom"><div class="actions"><button class="btn primary" id="barRandomGen">生成 12 位随机条码</button></div><div class="canvas" id="barRandomOutput"><div class="empty">点击按钮生成随机条码</div></div><div class="result" id="barRandomText">—</div></div>
<div class="view" id="barDecode"><div class="drop" id="barDrop"><strong>拖拽条码图片到这里</strong>或点击选择图片<input id="barFile" type="file" accept="image/*" hidden></div><div class="canvas" id="barPreview"><div class="empty">尚未选择图片</div></div><div class="result" id="barResult">识别结果会显示在这里</div></div></div></section>
<aside class="panel side"><h3>最近生成</h3><div class="history" id="history"><div class="empty">暂无记录</div></div><div class="divider"></div><div class="actions"><button class="btn ghost" id="copyLast">复制最近内容</button><button class="btn danger" id="clearHistory">清空记录</button></div><p class="hint">记录仅保存在当前浏览器，不会上传到服务器。</p></aside></div></main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let lastQR='',lastBar='',history=JSON.parse(localStorage.getItem('codekit-history')||'[]');
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function save(type,value){if(!value)return;history=[{type,value,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),id:Date.now()},...history.filter(x=>x.value!==value)].slice(0,12);localStorage.setItem('codekit-history',JSON.stringify(history));renderHistory()}
function renderHistory(){let h=$('#history');h.innerHTML=history.length?history.map(x=>`<div class="history-item" data-value="${encodeURIComponent(x.value)}"><b>${x.type==='qr'?'▦':'▥'} ${escapeHtml(x.value)}</b><small>${x.time}</small></div>`).join(''):'<div class="empty">暂无记录</div>';$$('.history-item').forEach(x=>x.onclick=()=>{let v=decodeURIComponent(x.dataset.value);navigator.clipboard?.writeText(v);toast('已复制内容')})}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function qr(el,text,size=280,level='M'){el.innerHTML='';new QRCode(el,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel[level]||QRCode.CorrectLevel.M});}
function svg(el,text){el.innerHTML='<svg></svg>';JsBarcode(el.querySelector('svg'),text,{format:'CODE128',width:2,height:110,displayValue:true,margin:12,lineColor:getComputedStyle(document.body).getPropertyValue('--text')||'#142033'});}
function download(el,name,type){let c=el.querySelector('canvas'),a=document.createElement('a');if(c){a.href=c.toDataURL('image/png');a.download=(name||'qrcode')+'.png'}else{let s=el.querySelector('svg');if(!s)return toast('请先生成内容');a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(s));a.download=(name||'barcode')+'.svg'}a.click();toast('已开始下载')}
$$('[data-mode]').forEach(b=>b.onclick=()=>{$$('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#qrArea').style.display=b.dataset.mode==='qr'?'block':'none';$('#barArea').style.display=b.dataset.mode==='bar'?'block':'none'});
$$('.tabs button').forEach(b=>b.onclick=()=>{let p=b.parentElement.parentElement; p.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));p.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});
$('#qrGen').onclick=()=>{let v=$('#qrInput').value.trim();if(!v)return toast('请输入内容');qr($('#qrOutput'),v,+$('#qrSize').value,$('#qrLevel').value);lastQR=v;save('qr',v);toast('二维码已生成')};$('#qrClear').onclick=()=>{$('#qrInput').value='';$('#qrOutput').innerHTML='<div class="empty">输入内容后生成二维码</div>'};$('#qrDownload').onclick=()=>download($('#qrOutput'),lastQR);$('#qrCopy').onclick=()=>{if(!lastQR)return toast('暂无内容');navigator.clipboard?.writeText(lastQR);toast('内容已复制')};
$('#randomGen').onclick=()=>{let n=Math.min(120,Math.max(4,+$('#randomLen').value||24));let v=Array.from({length:n},()=>Math.random().toString(36)[2]).join('');qr($('#randomOutput'),v,280,'H');$('#randomText').textContent=v;lastQR=v;save('qr',v)};
$('#barGen').onclick=()=>{let v=$('#barInput').value.trim();if(!v)return toast('请输入内容');if(!/^[\x00-\x7F]+$/.test(v))return toast('条码仅支持 ASCII 字符');svg($('#barOutput'),v);lastBar=v;save('bar',v);toast('条码已生成')};$('#barClear').onclick=()=>{$('#barInput').value='';$('#barOutput').innerHTML='<div class="empty">输入内容后生成条码</div>'};$('#barDownload').onclick=()=>download($('#barOutput'),lastBar);
$('#barRandomGen').onclick=()=>{let v=Array.from({length:12},()=>Math.floor(Math.random()*10)).join('');svg($('#barRandomOutput'),v);$('#barRandomText').textContent=v;lastBar=v;save('bar',v)};
function fileHandler(file,kind){if(!file)return;let r=new FileReader();r.onload=e=>{let src=e.target.result,preview=kind==='qr'?$('#qrPreview'):$('#barPreview');preview.innerHTML=`<img src="${src}" alt="预览">`;let img=new Image();img.onload=()=>{if(kind==='qr'){let c=document.createElement('canvas'),x=c.getContext('2d');c.width=img.width;c.height=img.height;x.drawImage(img,0,0);let d=x.getImageData(0,0,c.width,c.height),z=jsQR(d.data,d.width,d.height);$('#qrResult').textContent=z?'识别结果：'+z.data:'无法识别二维码'}else Quagga.decodeSingle({src,numOfWorkers:0,inputStream:{size:800},decoder:{readers:['code_128_reader','ean_reader','ean_8_reader','upc_reader','upc_e_reader']}},res=>$('#barResult').textContent=res&&res.codeResult?'识别结果：'+res.codeResult.code:'无法识别条码')};img.src=src};r.readAsDataURL(file)}
[['qrDrop','qrFile','qr'],['barDrop','barFile','bar']].forEach(([d,f,k])=>{let z=$('#'+d),i=$('#'+f);z.onclick=()=>i.click();i.onchange=e=>fileHandler(e.target.files[0],k);z.ondragover=e=>{e.preventDefault();z.style.background='var(--soft)'};z.ondragleave=()=>z.style.background='';z.ondrop=e=>{e.preventDefault();z.style.background='';fileHandler(e.dataTransfer.files[0],k)}});
$('#themeBtn').onclick=()=>{let d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'':'dark';localStorage.setItem('codekit-theme',d.dataset.theme);$('#themeBtn').textContent=d.dataset.theme==='dark'?'☀':'☾'};if(localStorage.getItem('codekit-theme')==='dark')$('#themeBtn').click();$('#copyLast').onclick=()=>{let v=lastQR||lastBar||history[0]?.value;if(v){navigator.clipboard?.writeText(v);toast('已复制最近内容')}else toast('暂无记录')};$('#clearHistory').onclick=()=>{history=[];localStorage.removeItem('codekit-history');renderHistory();toast('记录已清空')};renderHistory();
</script><script src="/Static/js/jquery.js"></script><script src="/Static/js/Global.js"></script><script src="/Web/js/Global.js"></script><script src="/Web/js/OneOpenAI.js"></script></body></html>
